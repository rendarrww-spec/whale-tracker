name: Refresh whale list

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/refresh_whale_list.py"
      - ".github/workflows/refresh-whale-list.yml"

permissions:
  contents: write

concurrency:
  group: whale-tracker-repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run refresh script
        run: python scripts/refresh_whale_list.py
      - name: Commit and push if changed
        run: |
          git config user.name "whale-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/whale_list.json
          git diff --staged --quiet || git commit -m "Refresh whale list ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase --autostash origin main
          git push
