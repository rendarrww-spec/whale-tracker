name: Update whale positions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/update_positions.py"
      - ".github/workflows/update-positions.yml"
      - "data/whale_list.json"

permissions:
  contents: write

concurrency:
  group: whale-tracker-repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run update script
        run: python scripts/update_positions.py
      - name: Commit and push if changed
        run: |
          git config user.name "whale-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/whale_data.json data/history.jsonl
          git diff --staged --quiet || git commit -m "Update whale positions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase --autostash origin main
          git push
